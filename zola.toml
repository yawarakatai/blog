base_url = "https://blog.yawarakatai.com"
title = "yawarakatai blog"
description = "技術ブログっぽい見た目をしているが、それほど技術的じゃない"
default_language = "ja"
feed_filenames = ["atom.xml"]
taxonomies = [{ name = "tags" }]

[markdown]
external_links_no_follow = true
external_links_no_referrer = true
github_alerts = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"
